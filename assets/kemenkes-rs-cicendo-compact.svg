      <stop offset="0" stop-color="#22b8a7"/>
      <stop offset="1" stop-color="#11998f"/>
    </linearGradient>
    <linearGradient id="c-lime" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b6d93b"/>
      <stop offset="1" stop-color="#d7e35a"/>
