<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" role="img" aria-labelledby="title desc">
  <title id="title">Kemenkes RS Mata Cicendo Compact</title>
  <desc id="desc">Logo ringkas Kemenkes RS Mata Cicendo untuk tampilan mobile.</desc>

