<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" role="img" aria-labelledby="title desc">
  <title id="title">Kemenkes RS Mata Cicendo</title>
  <desc id="desc">Logo Kemenkes RS Mata Cicendo dengan simbol bunga silang dan teks.</desc>

  <defs>
    <linearGradient id="g-teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22b8a7"/>
      <stop offset="1" stop-color="#11998f"/>
    </linearGradient>
    <linearGradient id="g-lime" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b6d93b"/>
      <stop offset="1" stop-color="#d7e35a"/>
    </linearGradient>
    <linearGradient id="g-yellow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4e600"/>
      <stop offset="1" stop-color="#d9d400"/>
    </linearGradient>
  </defs>

  <g transform="translate(10,10)">
    <rect x="42" y="4" width="36" height="58" rx="16" fill="url(#g-teal)"/>
    <rect x="42" y="86" width="36" height="58" rx="16" fill="url(#g-teal)"/>
    <rect x="0" y="46" width="58" height="36" rx="16" fill="url(#g-teal)"/>
    <path d="M78 46h24c20 0 36 16 36 36s-16 36-36 36H78z" fill="url(#g-lime)"/>

    <path d="M78 46l34 34-34 34" fill="none" stroke="url(#g-yellow)" stroke-width="4"/>
    <path d="M58 46v68" fill="none" stroke="url(#g-yellow)" stroke-width="4"/>
    <path d="M58 80h54" fill="none" stroke="url(#g-yellow)" stroke-width="4"/>
  </g>

  <g transform="translate(165,18)" fill="#0e8b9d">
    <text x="0" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="0.5">Kemenkes</text>
    <text x="0" y="125" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="0.5">RS Mata Cicendo</text>
  </g>
