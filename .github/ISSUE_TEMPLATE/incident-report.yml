name: Incident report
description: Laporkan gangguan layanan, keamanan, atau integritas data SIMPELAPPI.
title: "[Incident]: "
labels:
  - incident
body:
  - type: markdown
    attributes:
      value: Jangan mencantumkan password, token, data pasien, atau informasi rahasia lainnya.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - SEV-1 - layanan kritis berhenti atau data terancam
        - SEV-2 - fungsi utama terganggu
        - SEV-3 - fungsi nonkritis terganggu
        - SEV-4 - dampak kecil
    validations:
      required: true
  - type: input
    id: detected-at
    attributes:
      label: Waktu terdeteksi
      description: Gunakan waktu lokal dan zona waktu.
      placeholder: 2026-08-02 08:00 WIB
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Dampak
      description: Jelaskan layanan, unit, dan pengguna yang terdampak tanpa memasukkan data sensitif.
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Gejala dan bukti
      description: Sertakan pesan error, log yang sudah disanitasi, atau tangkapan layar.
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Mitigasi sementara
      description: Tuliskan tindakan yang sudah dilakukan.
  - type: input
    id: owner
    attributes:
      label: Incident owner
      placeholder: "@username atau nama tim"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Konfirmasi privasi
      options:
        - label: Laporan ini tidak mengandung kredensial atau data pasien.
          required: true
