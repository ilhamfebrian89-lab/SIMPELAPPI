<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPELAPPI — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <section class="login-visual">
        <div class="login-badge">SIMPELAPPI</div>
        <h1>Enterprise Infection Prevention Management Platform</h1>
        <p>Monitoring, Audit, Surveilans, PPRA dan Education dalam satu ekosistem digital.</p>
      </section>
      <form class="login-card card" id="login-form">
        <p class="eyebrow">Welcome Back</p>
        <h2>Masuk ke Sistem</h2>
        <div class="field-row">
          <label>Username</label>
          <input id="login-username" name="username" type="text" title="Username" autocomplete="username" required />
        </div>
        <div class="field-row">
          <label>Password</label>
          <input id="login-password" name="password" type="password" title="Password" autocomplete="current-password" required />
        </div>
        <a class="text-link" href="index.html">Forgot password?</a>
        <div class="action-row">
          <button class="btn btn-primary" type="submit">Login</button>
        </div>
        <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
      </form>
    </div>
    <script src="login.js"></script>
  </body>
</html>
