<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Audit Bundles HAIs — Komite Pencegahan dan Pengendalian Infeksi</title>
<style>
  :root{
    --teal:#0d9488; --teal-d:#0f766e; --teal-bg:#ccfbf1;
    --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
    --line:#e2e8f0; --line-2:#f1f5f9; --bg:#f8fafc; --card:#ffffff;
    --em:#059669; --em-bg:#ecfdf5; --em-br:#a7f3d0;
    --am:#d97706; --am-bg:#fffbeb; --am-br:#fde68a;
    --ro:#e11d48; --ro-bg:#fff1f2; --ro-br:#fecdd3;
    --indigo:#4f46e5; --indigo-bg:#eef2ff;
    --radius:12px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;padding-bottom:76px;}
  .num{font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:var(--teal-d);}

  /* Layout */
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px;}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .hd{display:flex;align-items:center;gap:12px;padding:12px 0;}
  .logo{width:44px;height:44px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
  .logo img{width:100%;height:100%;object-fit:contain;}
  .hd .t{line-height:1.2;}
  .hd .t b{font-size:14px;font-weight:700;}
  .hd .t small{display:block;color:var(--muted);font-size:12px;}
  .badges{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .badge{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;}
  .badge.teal{background:var(--teal-bg);color:var(--teal-d);}
  .badge.indigo{background:var(--indigo-bg);color:var(--indigo);}
  @media(max-width:560px){ .badge.indigo{display:none;} }

  main{padding:20px 0;}

  /* Nav */
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);}
  .tabbar .inner{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  .tabbar button{background:none;border:none;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:11px;}
  .tabbar button.on{color:var(--teal);}
  .tabbar button.on span{font-weight:600;}
  .tabbar svg{width:22px;height:22px;}

  /* Panels & cards */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .panel + .panel{margin-top:16px;}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .panel-h h3{font-size:14px;font-weight:600;color:#334155;}
  .grid{display:grid;gap:12px;}
  .stack>*+*{margin-top:16px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}

  .stat{border-radius:var(--radius);border:1px solid var(--line);padding:14px;background:var(--card);}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .stat .v{font-size:28px;font-weight:700;margin-top:6px;}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat .n{font-size:11px;color:var(--faint);margin-top:6px;}
  .dot{width:10px;height:10px;border-radius:999px;display:inline-block;}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:820px){ .cards{grid-template-columns:repeat(4,1fr);} }
  .two{display:grid;gap:16px;}
  @media(min-width:820px){ .two{grid-template-columns:1fr 1fr;} }

  /* status colors */
  .hijau{background:var(--em-bg);border-color:var(--em-br);} .hijau .v{color:var(--em);}
  .kuning{background:var(--am-bg);border-color:var(--am-br);} .kuning .v{color:var(--am);}
  .merah{background:var(--ro-bg);border-color:var(--ro-br);} .merah .v{color:var(--ro);}
  .netral .v{color:var(--faint);}
  .txt-hijau{color:var(--em)!important;} .txt-kuning{color:var(--am)!important;} .txt-merah{color:var(--ro)!important;} .txt-netral{color:var(--faint)!important;}
  .dot-hijau{background:var(--em);} .dot-kuning{background:var(--am);} .dot-merah{background:var(--ro);} .dot-netral{background:#cbd5e1;}

  /* Form */
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
  .field label{font-size:12px;font-weight:500;color:var(--muted);}
  .inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:#334155;background:#fff;outline:none;}
  .inp:focus{border-color:#5eead4;box-shadow:0 0 0 3px #ccfbf1;}
  textarea.inp{resize:vertical;}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:820px){ .form-grid{grid-template-columns:repeat(3,1fr);} }

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#475569;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:500;}
  .btn:hover{background:#f8fafc;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn svg{width:15px;height:15px;}
  .btn-primary{width:100%;justify-content:center;background:var(--teal);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-size:14px;font-weight:600;}
  .btn-primary:hover{background:var(--teal-d);}
  .btn-primary:disabled{background:#cbd5e1;}
  .btn-danger{border-color:var(--ro-br);color:var(--ro);}
  .btn-danger:hover{background:var(--ro-bg);}
  .link{background:none;border:none;color:var(--teal-d);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:0;}

  /* Segments */
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;}
  .seg-btn.ya{color:var(--em);border-color:var(--em-br);}
  .seg-btn.tidak{color:var(--ro);border-color:var(--ro-br);}
  .seg-btn.na{color:var(--muted);}
  .seg-btn.ya.active{background:var(--em);color:#fff;border-color:var(--em);}
  .seg-btn.tidak.active{background:var(--ro);color:#fff;border-color:var(--ro);}
  .seg-btn.na.active{background:#475569;color:#fff;border-color:#475569;}

  .elrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line-2);}
  .elrow:first-child{border-top:none;}
  @media(min-width:640px){ .elrow{flex-direction:row;align-items:center;justify-content:space-between;} }
  .elrow.gagal{background:var(--ro-bg);border-radius:9px;padding-left:8px;padding-right:8px;margin:0 -8px;}
  .elrow .lbl{display:flex;gap:8px;font-size:14px;}
  .elrow .lbl .no{font-weight:700;color:var(--faint);}
  .elrow.gagal .lbl{color:#be123c;}
  .fase-h{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-d);background:var(--teal-bg);border-radius:6px;padding:5px 10px;margin:14px 0 4px;}
  #checklist > .fase-h:first-child{margin-top:0;}

  /* Banner */
  .banner{display:flex;align-items:center;gap:12px;border-radius:var(--radius);border:1px solid var(--line);padding:12px 16px;}
  .banner svg{width:22px;height:22px;flex:none;}
  .banner.ok{background:var(--em-bg);border-color:var(--em-br);color:var(--em);}
  .banner.no{background:var(--ro-bg);border-color:var(--ro-br);color:var(--ro);}
  .banner.wait{background:#f8fafc;color:var(--muted);}
  .banner b{display:block;font-size:14px;}
  .banner .d{font-size:12px;}
  .flash{display:flex;align-items:center;gap:8px;background:var(--em-bg);border:1px solid var(--em-br);color:var(--em);border-radius:9px;padding:10px 14px;font-size:14px;margin-bottom:16px;}

  /* Table */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#f8fafc;padding:10px 12px;border-bottom:1px solid var(--line);}
  tbody td{padding:10px 12px;border-top:1px solid var(--line-2);}
  tbody tr:hover{background:#f8fafc;}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;}
  .pill svg{width:12px;height:12px;}
  .pill.ok{background:var(--em-bg);color:var(--em);}
  .pill.no{background:var(--ro-bg);color:var(--ro);}
  .icon-btn{background:none;border:none;color:#cbd5e1;padding:4px;}
  .icon-btn:hover{color:var(--ro);}
  .icon-btn svg{width:16px;height:16px;display:block;}

  /* report table with borders */
  .rpt-tbl{border-collapse:collapse;width:100%;font-size:13px;}
  .rpt-tbl th,.rpt-tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
  .rpt-tbl th{background:#f8fafc;font-size:11px;text-transform:uppercase;color:var(--muted);}

  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px dashed #cbd5e1;border-radius:var(--radius);background:#fff;padding:48px 16px;color:var(--faint);text-align:center;}
  .empty svg{width:26px;height:26px;}
  .mini-empty{display:flex;align-items:center;justify-content:center;height:150px;color:var(--faint);font-size:13px;}

  .chart-wrap{width:100%;}
  .chart-wrap svg{width:100%;height:auto;display:block;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--muted);}
  .legend i{width:12px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle;}

  .list-item{display:flex;align-items:center;gap:8px;background:#f8fafc;border-radius:9px;padding:6px 12px;font-size:14px;}
  .list-item .x{margin-left:auto;}
  .list-item+.list-item{margin-top:6px;}

  .acc{border:1px solid var(--line);border-radius:9px;}
  .acc+.acc{margin-top:8px;}
  .acc-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:10px 12px;text-align:left;font-size:14px;}
  .acc-h:hover{background:#f8fafc;}
  .acc-h svg{width:16px;height:16px;color:var(--faint);flex:none;}
  .acc-h .cnt{margin-left:auto;font-size:12px;color:var(--faint);}
  .acc-b{border-top:1px solid var(--line-2);padding:12px;}
  .el-edit{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .el-edit .no{width:20px;text-align:right;font-size:12px;color:var(--faint);}
  .el-edit .inp{width:auto;}
  .el-edit .txt{flex:1;min-width:120px;}
  .el-edit .fase-inp{width:150px;flex:none;}
  @media(max-width:560px){ .el-edit{flex-wrap:wrap;} .el-edit .txt{min-width:100%;} }

  .sign{display:flex;justify-content:flex-end;padding-top:28px;}
  .sign .box{text-align:center;font-size:13px;}
  .sign .gap{height:74px;}
  .sign .nm{font-weight:600;text-decoration:underline;text-underline-offset:4px;}
  .sign .sub{font-size:12px;color:var(--muted);}

  .note{font-size:12px;color:var(--faint);margin-top:8px;}
  .search-ic{position:absolute;left:9px;top:9px;width:15px;height:15px;color:var(--faint);pointer-events:none;}
  .foto-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .foto-thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .foto-thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;}
  .foto-thumb .del{position:absolute;top:2px;right:2px;background:rgba(15,23,42,.6);color:#fff;border:none;border-radius:999px;width:20px;height:20px;line-height:1;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .foto-add{width:84px;height:84px;border:1px dashed #cbd5e1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;cursor:pointer;background:#fff;}
  .foto-add:hover{background:#f8fafc;border-color:var(--teal);}
  .foto-add svg{width:20px;height:20px;}
  .icon-btn.cam{color:var(--teal);}
  .icon-btn.cam:hover{color:var(--teal-d);}
  .lightbox{position:fixed;inset:0;background:rgba(15,23,42,.9);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;}
  .lightbox img{max-width:100%;max-height:78vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lightbox .lb-nav{display:flex;align-items:center;gap:16px;color:#fff;font-size:14px;}
  .lightbox button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
  .lightbox .lb-close{background:#fff;color:#0f172a;border:none;}

  @media print{
    @page{ size:A4 portrait; margin:10mm; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    html,body{ background:#fff; }
    body{ padding:0 !important; }
    main{ padding:0 !important; }
    .wrap{ max-width:none !important; padding:0 !important; }
    header, nav.tabbar, .no-print{ display:none !important; }
    .panel{ border:none !important; padding:0 !important; margin:0 !important; }
    .cetak-area{ zoom: var(--print-zoom, 1); }
    .cetak-area .stack>*+*{ margin-top:8px !important; }
    .cetak-area h2{ font-size:15px !important; }
    .cetak-area h3{ font-size:11px !important; margin-bottom:4px !important; }
    .tbl-wrap{ overflow:visible !important; border:none !important; }
    .rpt-tbl th,.rpt-tbl td{ padding:3px 6px !important; font-size:10px !important; }
    .cetak-area, .rpt-tbl, .sign{ page-break-inside:avoid; }
    .sign{ padding-top:16px !important; }
    .sign .gap{ height:52px !important; }
  }


.ppi-banner{
max-width:1000px;
margin:18px auto 10px;
padding:18px 22px;
background:linear-gradient(135deg,#0f766e,#0d9488);
color:#fff;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
display:flex;
align-items:center;
gap:18px}
.ppi-banner img{width:74px;height:74px;background:#fff;border-radius:12px;padding:6px}
.ppi-banner .tx{flex:1;text-align:center}
.ppi-banner h1{margin:0;font-size:30px;font-weight:800}
.ppi-banner h2{margin:6px 0 2px;font-size:18px;font-weight:700}
.ppi-banner p{margin:0;font-size:14px;opacity:.95}
</style>
</head>

/* ═══════════════════ PENYIMPANAN (localStorage + fallback memori) ═══════════════════ */
const _mem = {};
const store = {
  read(key, def){ try{ const v = localStorage.getItem(key); return v===null ? (key in _mem ? _mem[key] : def) : JSON.parse(v); }catch(e){ return key in _mem ? _mem[key] : def; } },
  write(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ _mem[key]=val; if(e && (e.name==="QuotaExceededError"||e.code===22)){ if(!store._warned){ store._warned=true; setTimeout(function(){ alert("Penyimpanan browser penuh \u2014 foto mungkin tidak tersimpan permanen. Kurangi jumlah/ukuran foto atau ekspor data secara berkala."); },0); } } } }
};

/* ═══════════════════ STATE ═══════════════════ */
const state = {
  tab:"dashboard",
  bundles: DEFAULT_BUNDLES, units: DEFAULT_UNITS, auditors: DEFAULT_AUDITORS,
  target: DEFAULT_TARGET, akreditasi: {...DEFAULT_AKR}, observations: [],
  filter:{unit:"", dari:"", sampai:""}, paretoBundle:"vap", settingsOpen:null, flash:false,
  input:{ bundleId:"vap", tanggal:localDT(), auditor:"IPCN", unit:"ICU", pasien:"", kategori:"Dewasa", catatan:"", jawaban:{}, foto:[] },
};
(function load(){
  const cfg = store.read("hais_config", null);
  if(cfg){
    state.bundles = cfg.bundles || DEFAULT_BUNDLES;
    state.units = cfg.units || DEFAULT_UNITS;
    state.auditors = cfg.auditors || DEFAULT_AUDITORS;
    state.target = (cfg.target != null ? cfg.target : DEFAULT_TARGET);
    state.akreditasi = cfg.akreditasi || {...DEFAULT_AKR};
  }
  state.observations = store.read("hais_obs", []) || [];
  state.paretoBundle = state.bundles[0] ? state.bundles[0].id : "";
  state.input.bundleId = state.bundles[0] ? state.bundles[0].id : "";
  state.input.unit = state.units[0] || "";
  state.input.auditor = state.auditors[0] || "";
})();
function persist(){
  store.write("hais_config", {bundles:state.bundles, units:state.units, auditors:state.auditors, target:state.target, akreditasi:state.akreditasi});
  store.write("hais_obs", state.observations);
}

/* ═══════════════════ HELPER ═══════════════════ */
function localDT(){ const n=new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,16); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function bulanDari(iso){ return (iso||"").slice(0,7); }
function labelBulan(iso){ if(!iso) return "–"; const p=iso.split("-"); return NAMA_BULAN[+p[1]-1]+" "+p[0]; }
function tglIndo(d){ d=d||new Date(); return d.getDate()+" "+NAMA_BULAN[d.getMonth()]+" "+d.getFullYear(); }
function bulanTersisa(iso){ if(!iso) return null; const n=new Date(); const p=iso.split("-").map(Number); return (p[0]-n.getFullYear())*12+(p[1]-1-n.getMonth()); }

// Inti all-or-none
function hitungHasil(jawaban){
  const vals = Object.keys(jawaban).map(k=>jawaban[k]).filter(Boolean);
  const tidak = vals.filter(v=>v==="Tidak").length;
  const ya = vals.filter(v=>v==="Ya").length;
  return { patuh: tidak===0 && ya>=1, jmlTidak:tidak, jmlYa:ya };
}
function kepatuhan(list){ if(!list.length) return null; return list.filter(o=>o.patuh).length / list.length * 100; }
function statusWarna(pct, target){ if(pct==null) return "netral"; if(pct>=target) return "hijau"; if(pct>=target-10) return "kuning"; return "merah"; }
function statusHex(pct, target){ return {hijau:"#10b981",kuning:"#f59e0b",merah:"#f43f5e",netral:"#cbd5e1"}[statusWarna(pct,target)]; }
function fmtPct(p){ if(p==null) return "–"; return (Math.round(p*10)/10).toFixed(1).replace(".",",")+"%"; }
function bundleById(id){ return state.bundles.filter(b=>b.id===id)[0]; }
function namaEl(bid, eid){ const b=bundleById(bid); if(!b) return eid; const el=b.elemen.filter(e=>e.id===eid)[0]; return el?el.teks:eid; }
function obsTerfilter(){
  return state.observations.filter(o=>{
    if(state.filter.unit && o.unit!==state.filter.unit) return false;
    const b=bulanDari(o.tanggal);
    if(state.filter.dari && b<state.filter.dari) return false;
    if(state.filter.sampai && b>state.filter.sampai) return false;
    return true;
  });
}

/* ═══════════════════ GRAFIK (SVG murni) ═══════════════════ */
function chartTren(rows, bundles, target){
  if(!rows.length) return '<div class="mini-empty">Belum ada data pada rentang ini.</div>';
  const W=680,H=250,pL=42,pR=14,pT=14,pB=30, iw=W-pL-pR, ih=H-pT-pB, n=rows.length;
  const X=function(i){ return n===1 ? pL+iw/2 : pL+iw*i/(n-1); };
  const Y=function(v){ return pT+ih*(1-v/100); };
  let g="";
  [0,25,50,75,100].forEach(function(v){ const y=Y(v); g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#e2e8f0"/><text x="'+(pL-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+v+'</text>'; });
  const ty=Y(target); g+='<line x1="'+pL+'" y1="'+ty+'" x2="'+(W-pR)+'" y2="'+ty+'" stroke="#0d9488" stroke-dasharray="4 4"/><text x="'+(W-pR)+'" y="'+(ty-4)+'" text-anchor="end" font-size="9" fill="#0d9488">Target '+target+'%</text>';
  const step = n>8 ? Math.ceil(n/8) : 1;
  rows.forEach(function(r,i){ if(i%step===0){ g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#94a3b8">'+esc(r.bulan)+'</text>'; }});
  bundles.forEach(function(b,bi){
    const col=BUNDLE_COLORS[bi%BUNDLE_COLORS.length];
    const pts=[];
    rows.forEach(function(r,i){ const v=r[b.kode]; if(v!=null) pts.push([X(i),Y(v),v,r.bulan]); });
    if(pts.length>1) g+='<polyline points="'+pts.map(function(p){return p[0]+","+p[1];}).join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
    pts.forEach(function(p){ g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+col+'"><title>Audit Bundles HAIs — Komite Pencegahan dan Pengendalian Infeksi</title></circle>'; });
  });
  const legend = bundles.map(function(b,bi){ return '<span><i style="background:'+BUNDLE_COLORS[bi%BUNDLE_COLORS.length]+'"></i>'+esc(b.kode)+'</span>'; }).join("");
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg></div><div class="legend">'+legend+'</div>';
}
function chartBarUnit(data, target){
  if(!data.length) return '<div class="mini-empty">Belum ada data.</div>';
  const W=680,H=240,pL=42,pR=14,pT=14,pB=34, iw=W-pL-pR, ih=H-pT-pB, n=data.length;
  const Y=function(v){ return pT+ih*(1-v/100); };
  let g="";
  [0,25,50,75,100].forEach(function(v){ const y=Y(v); g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#e2e8f0"/><text x="'+(pL-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+v+'</text>'; });
  const ty=Y(target); g+='<line x1="'+pL+'" y1="'+ty+'" x2="'+(W-pR)+'" y2="'+ty+'" stroke="#0d9488" stroke-dasharray="4 4"/>';
  const slot=iw/n, bw=Math.min(46, slot*0.6);
  data.forEach(function(d,i){ const x=pL+slot*i+(slot-bw)/2; const y=Y(d.value); const h=Y(0)-y;
    g+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+statusHex(d.value,target)+'"><title>Audit Bundles HAIs — Komite Pencegahan dan Pengendalian Infeksi</title></rect>';
    g+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="10" fill="#475569">'+d.value+'</text>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="#64748b">'+esc(d.label)+'</text>';
  });
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg></div>';
}
function chartPareto(data){
  if(!data.length) return '<div class="mini-empty">Tidak ada elemen yang gagal.</div>';
  const W=680, rowH=30, pT=8, pB=8, pL=200, pR=40;
  const H=pT+pB+data.length*rowH, iw=W-pL-pR;
  let max=1; data.forEach(function(d){ if(d.value>max) max=d.value; });
  let g="";
  data.forEach(function(d,i){ const y=pT+i*rowH+4, bh=rowH-12, w=iw*d.value/max;
    g+='<text x="'+(pL-8)+'" y="'+(y+bh/2+3)+'" text-anchor="end" font-size="10" fill="#475569">'+esc(d.label)+'<title>Audit Bundles HAIs — Pusat Mata Nasional Rumah Sakit Mata Cicendo Bandung</title></text>';
    g+='<rect x="'+pL+'" y="'+y+'" width="'+Math.max(2,w)+'" height="'+bh+'" rx="3" fill="#e11d48"/>';
    g+='<text x="'+(pL+w+6)+'" y="'+(y+bh/2+3)+'" font-size="10" fill="#475569">'+d.value+'×</text>';
  });
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg></div>';
}

function bannerHTML(){

function syncInput(){ const g=function(id){ return byId(id)?byId(id).value:""; }; const I=state.input;
  I.tanggal=g("i-tgl"); I.auditor=g("i-auditor"); I.unit=g("i-unit"); I.pasien=g("i-pasien"); I.kategori=g("i-kat"); I.catatan=g("i-catatan"); }
function prosesFoto(file, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1000, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      var uri; try{ uri=cv.toDataURL("image/jpeg",0.6); }catch(err){ uri=e.target.result; }
      cb(uri);
    };
    img.onerror=function(){ cb(e.target.result); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleFotoInput(input){
  var files=Array.prototype.slice.call(input.files||[]);
  if(!files.length) return;
  syncInput();
  var sisa=files.length;
  files.forEach(function(f){ if(f.type.indexOf("image")<0){ if(--sisa===0) renderInput(); return; }
    prosesFoto(f,function(uri){ state.input.foto.push(uri); if(--sisa===0){ renderInput(); } }); });
  input.value="";
}
function bukaLightbox(list, idx){
  if(!list || !list.length) return;
  idx = idx||0;
  var ov=document.createElement("div"); ov.className="lightbox";
  function draw(){ ov.innerHTML='<img src="'+list[idx]+'">'
    + (list.length>1?'<div class="lb-nav"><button data-p>\u2039 Sebelumnya</button><span>'+(idx+1)+' / '+list.length+'</span><button data-n>Berikutnya \u203a</button></div>':'')
    + '<button class="lb-close">Tutup \u2715</button>'; }
  draw();
  ov.onclick=function(e){
    if(e.target.hasAttribute("data-p")){ idx=(idx-1+list.length)%list.length; draw(); return; }
    if(e.target.hasAttribute("data-n")){ idx=(idx+1)%list.length; draw(); return; }
    if(e.target===ov || e.target.closest(".lb-close")){ document.body.removeChild(ov); }
  };
  document.body.appendChild(ov);
}
function bindInput(){
  const bd=byId("go-dash"); if(bd) bd.onclick=function(){ state.tab="dashboard"; state.flash=false; render(); };
  const bsel=byId("i-bundle"); if(bsel) bsel.onchange=function(e){ syncInput(); state.input.bundleId=e.target.value; state.input.jawaban={}; renderInput(); };

    const elId=btn.dataset.el, val=btn.dataset.val;
    state.input.jawaban[elId]=val;
    const row=cl.querySelector('[data-row="'+elId+'"]');

  document.querySelectorAll("[data-fotoinput]").forEach(function(inp){ inp.onchange=function(){ handleFotoInput(inp); }; });
  var fgrid=byId("foto-grid"); if(fgrid) fgrid.onclick=function(e){
    var d=e.target.closest("[data-dfoto]"); if(d){ syncInput(); state.input.foto.splice(parseInt(d.dataset.dfoto),1); renderInput(); return; }
    var v=e.target.closest("[data-vfoto]"); if(v){ bukaLightbox(state.input.foto, parseInt(v.dataset.vfoto)); }
  };
  const save=byId("i-save"); if(save) save.onclick=simpanObs;
  refreshBanner();
}
function renderInput(){ const m=byId("main"); m.innerHTML=viewInput(); bindInput(); }
function simpanObs(){
  syncInput(); const I=state.input, b=bundleById(I.bundleId);
  const lengkap = b && b.elemen.every(function(el){return I.jawaban[el.id];});
  if(!(b && I.unit && I.pasien.trim() && lengkap)) return;
  const h=hitungHasil(I.jawaban);
  state.observations.unshift({ id:uid(), tanggal:I.tanggal, auditor:I.auditor, unit:I.unit, bundleId:I.bundleId, bundleKode:b.kode,
    pasien:I.pasien.trim(), kategori:I.kategori, jawaban:Object.assign({},I.jawaban), patuh:h.patuh, catatan:I.catatan.trim(), foto:(I.foto||[]).slice() });
  persist();
  state.input.pasien=""; state.input.catatan=""; state.input.jawaban={}; state.input.foto=[];
  state.flash=true; render();
  setTimeout(function(){ state.flash=false; const f=document.querySelector(".flash"); if(f) f.style.display="none"; },2500);
}

function applyRiwayat(){
  const b=byId("r-bundle")?byId("r-bundle").value:"", u=byId("r-unit")?byId("r-unit").value:"", h=byId("r-hasil")?byId("r-hasil").value:"", c=(byId("r-cari")?byId("r-cari").value:"").toLowerCase();
  const body=byId("r-body"); if(!body) return; let vis=0;
  body.querySelectorAll("tr").forEach(function(tr){
    let ok=true;
    if(b && b!=="Semua" && tr.dataset.b!==b) ok=false;
    if(u && u!=="Semua" && tr.dataset.u!==u) ok=false;
    if(h && tr.dataset.h!==h) ok=false;
    if(c && tr.dataset.t.indexOf(c)<0) ok=false;
    tr.hidden=!ok; if(ok) vis++;
  });
  const cnt=byId("r-count"); if(cnt) cnt.textContent=vis+" observasi";
}
function bindRiwayat(){
  ["r-bundle","r-unit","r-hasil"].forEach(function(id){ const el=byId(id); if(el) el.onchange=applyRiwayat; });
  const c=byId("r-cari"); if(c) c.oninput=applyRiwayat;
  const body=byId("r-body");
  if(body) body.onclick=function(e){
    const cam=e.target.closest("[data-foto]"); if(cam){ const o=state.observations.filter(function(x){return x.id===cam.dataset.foto;})[0]; if(o&&o.foto) bukaLightbox(o.foto,0); return; }
    const btn=e.target.closest("[data-del]"); if(!btn) return;
    if(confirm("Hapus observasi ini? Tindakan tidak dapat dibatalkan.")){ state.observations=state.observations.filter(function(o){return o.id!==btn.dataset.del;}); persist(); render(); } };
}

/* ═══════════════════ LAPORAN ═══════════════════ */

    + '<button class="btn" id="ex-csv" '+dis+'>'+svg("download")+'CSV</button>'
    + '<button class="btn" id="ex-xls" '+dis+'>'+svg("excel")+'Excel</button>'
    + '<button class="btn" id="ex-star" '+dis+'>'+svg("shield")+'Rekap STARKES</button>'
    + '<button class="btn" id="ex-pdf" '+dis+'>'+svg("printer")+'PDF / Cetak</button>'

  if(!state.observations.length) return btns+emptyState("Belum ada data untuk dilaporkan.");

  const sisa=bulanTersisa(state.akreditasi.bulan);
  const akrLine = state.akreditasi.bulan ? '<p style="margin:4px 0 0;font-size:12px;font-weight:600;color:var(--indigo)">Target akreditasi STARKES: '+esc(labelBulan(state.akreditasi.bulan))+(sisa!=null?(sisa>0?" · "+sisa+" bulan lagi":sisa===0?" · bulan ini":" · telah lewat"):"")+'</p>' : "";

  const rbRows = rekapBundle.map(function(r){ return '<tr><td style="font-weight:500">'+esc(r.b.kode)+' <span style="font-weight:400;color:var(--faint)">'+esc(r.b.nama)+'</span></td><td class="num">'+r.n+'</td><td class="num">'+r.patuh+'</td><td class="num txt-'+statusWarna(r.pct,state.target)+'" style="font-weight:600">'+fmtPct(r.pct)+'</td></tr>'; }).join("");

  const rekapUnit=[]; state.bundles.forEach(function(b){ state.units.forEach(function(u){ const l=state.observations.filter(function(o){return o.bundleId===b.id&&o.unit===u;}); if(l.length) rekapUnit.push({bundle:b.kode,unit:u,n:l.length,patuh:l.filter(function(o){return o.patuh;}).length,pct:kepatuhan(l)}); }); });
  const ruRows = rekapUnit.map(function(r){ return '<tr><td style="font-weight:500">'+esc(r.bundle)+'</td><td style="color:#475569">'+esc(r.unit)+'</td><td class="num">'+r.n+'</td><td class="num">'+r.patuh+'</td><td class="num txt-'+statusWarna(r.pct,state.target)+'" style="font-weight:600">'+fmtPct(r.pct)+'</td></tr>'; }).join("");

  const starkes = rekapBundle.map(function(r){ const tercapai=r.pct!=null&&r.pct>=state.target;
    return '<tr><td>Kepatuhan '+esc(r.b.nama)+'</td><td class="num">'+r.patuh+'</td><td class="num">'+r.n+'</td><td class="num txt-'+statusWarna(r.pct,state.target)+'" style="font-weight:600">'+fmtPct(r.pct)+'</td><td class="num">'+state.target+'%</td><td>'+(r.pct==null?'<span style="color:var(--faint)">–</span>':(tercapai?'<span style="color:var(--em);font-weight:500">Tercapai</span>':'<span style="color:var(--ro);font-weight:500">Belum Tercapai</span>'))+'</td></tr>'; }).join("");

  const A=state.akreditasi;
  const sign='<div class="sign"><div class="box"><p>'+esc(A.kota||"Bandung")+', '+tglIndo()+'</p><p>Divalidasi oleh '+esc(A.jabatan||"IPCN")+',</p><div class="gap"></div><p class="nm">'+(A.ipcn?esc(A.ipcn):"( ……………………………… )")+'</p><p class="sub">'+esc(A.jabatan||"IPCN")+' · Pusat Mata Nasional Rumah Sakit Mata Cicendo Bandung</p></div></div>';

  return btns + '<div class="panel stack">'
    + '<div style="border-bottom:1px solid var(--line);padding-bottom:12px;display:flex;align-items:center;gap:14px"><img src="'+LOGO+'" alt="HIPPII" style="width:56px;height:56px;object-fit:contain;flex:none"><div><h2 style="font-size:16px">Laporan Kepatuhan Bundle HAIs</h2><p style="margin:2px 0 0;font-size:12px;color:var(--muted)"><b style="color:var(--teal-d)">Audit Bundles HAIs</b> — Pusat Mata Nasional Rumah Sakit Mata Cicendo Bandung · Pusat Mata Nasional Rumah Sakit Mata Cicendo Bandung · Target ≥ '+state.target+'% · Total '+state.observations.length+' observasi</p>'+akrLine+'</div></div>'
    + '<div><h3 style="font-size:14px;margin-bottom:8px">Rekap per Bundle</h3><table class="rpt-tbl"><thead><tr><th>Bundle</th><th>Observasi</th><th>Patuh</th><th>Kepatuhan</th></tr></thead><tbody>'+rbRows+'</tbody></table></div>'
    + '<div><h3 style="font-size:14px;margin-bottom:8px">Rekap per Bundle × Unit</h3><div class="tbl-wrap" style="border:none"><table class="rpt-tbl"><thead><tr><th>Bundle</th><th>Unit</th><th>Observasi</th><th>Patuh</th><th>Kepatuhan</th></tr></thead><tbody>'+ruRows+'</tbody></table></div></div>'
    + '<div><h3 style="font-size:14px;margin-bottom:8px">Rekap Indikator Mutu (Format STARKES)</h3><div class="tbl-wrap" style="border:none"><table class="rpt-tbl"><thead><tr><th>Indikator Mutu</th><th>Numerator</th><th>Denominator</th><th>Capaian</th><th>Target</th><th>Status</th></tr></thead><tbody>'+starkes+'</tbody></table></div></div>'
    + sign
    + '</div>';
}
function cetakPDF(){
  var area = document.querySelector(".cetak-area");
  if(!area){ window.print(); return; }
  // Area cetak A4 potret dengan margin 10mm @96dpi (px)
  var PWpx = 718, PHpx = 1047;
  // Ukur tinggi sebenarnya via kloning offscreen berlebar A4 + gaya kompak (mendekati hasil cetak)
  var clone = area.cloneNode(true);
  clone.style.cssText = "position:absolute;left:-99999px;top:0;width:"+PWpx+"px;font-size:10px;";
  document.body.appendChild(clone);
  clone.querySelectorAll(".rpt-tbl th,.rpt-tbl td").forEach(function(c){ c.style.padding="3px 6px"; c.style.fontSize="10px"; });
  clone.querySelectorAll("h2").forEach(function(c){ c.style.fontSize="15px"; });
  clone.querySelectorAll("h3").forEach(function(c){ c.style.fontSize="11px"; });
  var h = clone.scrollHeight;
  document.body.removeChild(clone);
  // Skala uniform (aspek rasio terjaga) agar muat 1 halaman; beri margin aman 2%
  var zoom = Math.min(1, PHpx / (h||PHpx)) * 0.98;
  if(zoom < 0.4) zoom = 0.4;
  document.documentElement.style.setProperty("--print-zoom", zoom.toFixed(3));
  setTimeout(function(){ window.print(); }, 30);
}
function bindLaporan(){
  const c=byId("ex-csv"), x=byId("ex-xls"), s=byId("ex-star"), p=byId("ex-pdf");
  if(c) c.onclick=exportCSV; if(x) x.onclick=exportExcel; if(s) s.onclick=exportStarkes; if(p) p.onclick=cetakPDF;
}

/* ═══════════════════ PENGATURAN ═══════════════════ */
function viewPengaturan(){
  const A=state.akreditasi;
  const target='<div class="panel"><div class="panel-h"><h3>Target Kepatuhan</h3></div><div class="row" style="align-items:center">'
    + '<input type="number" min="0" max="100" id="s-target" class="inp" style="width:90px" value="'+state.target+'">'
    + '<span style="font-size:14px;color:var(--muted)">% — hijau bila ≥ target, kuning bila dalam 10% di bawah target, merah selebihnya.</span></div></div>';
  const akr='<div class="panel"><div class="panel-h"><h3>Akreditasi &amp; Validasi Laporan</h3></div><div class="form-grid">'
    + field("Bulan target akreditasi", '<input type="month" id="a-bulan" class="inp" value="'+esc(A.bulan)+'">')

    + field("Jabatan", '<input id="a-jabatan" class="inp" placeholder="IPCN" value="'+esc(A.jabatan)+'">')

    if(open){
      body='<div class="acc-b"><div class="form-grid" style="grid-template-columns:repeat(3,1fr)">'

        + field("Nama", '<input class="inp" data-bfield="nama" data-bid="'+b.id+'" value="'+esc(b.nama)+'">')
        + field("Deskripsi", '<input class="inp" data-bfield="deskripsi" data-bid="'+b.id+'" value="'+esc(b.deskripsi)+'">')
        + '</div><div style="margin-top:8px">'
        + b.elemen.map(function(el,i){ return '<div class="el-edit"><span class="no num">'+(i+1)+'.</span><input class="inp txt" data-efield data-bid="'+b.id+'" data-eid="'+el.id+'" value="'+esc(el.teks)+'"><input class="inp fase-inp" data-efase data-bid="'+b.id+'" data-eid="'+el.id+'" value="'+esc(el.fase||"")+'" placeholder="Fase (opsional)"><button class="icon-btn" data-edel data-bid="'+b.id+'" data-eid="'+el.id+'">'+svg("trash")+'</button></div>'; }).join("")
        + '</div><div class="row" style="justify-content:space-between;margin-top:10px">'
        + '<button class="link" data-eadd="'+b.id+'">'+svg("plus")+'Tambah elemen</button>'
        + '<button class="link" style="color:var(--ro)" data-bdel="'+b.id+'">'+svg("trash")+'Hapus bundle</button></div></div>';
    }
    return '<div class="acc"><button class="acc-h" data-bopen="'+b.id+'">'+svg(open?"chevD":"chevR")+'<b>'+esc(b.kode)+'</b><span style="color:var(--faint)">·</span><span style="color:#475569">'+esc(b.nama)+'</span><span class="cnt num">'+b.elemen.length+' elemen</span></button>'+body+'</div>';
  }).join("");
  const bundlePanel='<div class="panel"><div class="panel-h"><h3>Bundle &amp; Elemen</h3><div class="row" style="gap:8px;align-items:center"><button class="btn" id="b-restore">'+svg("reset")+'Bawaan</button><button class="btn" id="b-add">'+svg("plus")+'Tambah bundle</button></div></div>'+bundleAcc+'</div>';
  const dataPanel='<div class="panel"><div class="panel-h"><h3>Data</h3></div><div class="row" style="align-items:center"><button class="btn btn-danger" id="d-reset">'+svg("reset")+'Kosongkan semua observasi</button><span style="font-size:12px;color:var(--faint)" class="num">'+state.observations.length+' observasi tersimpan</span></div></div>';
  return '<div class="stack">'+target+akr+lists+bundlePanel+dataPanel+'</div>';

function daftarPanel(judul, key, items){
  const rows=items.map(function(it){ return '<div class="list-item"><span>'+esc(it)+'</span><button class="icon-btn x" data-ldel="'+key+'" data-val="'+esc(it)+'">'+svg("x")+'</button></div>'; }).join("");
  return '<div class="panel"><div class="panel-h"><h3>'+judul+'</h3></div><div>'+rows+'</div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input class="inp" id="ladd-'+key+'" placeholder="Tambah baru…"><button class="btn" data-ladd="'+key+'">'+svg("plus")+'</button></div></div>';

function bindPengaturan(){
  const t=byId("s-target"); if(t) t.onchange=function(e){ state.target=Math.max(0,Math.min(100,parseInt(e.target.value)||0)); persist(); render(); };
  [["a-bulan","bulan"],["a-ipcn","ipcn"],["a-jabatan","jabatan"],["a-kota","kota"]].forEach(function(pair){ const el=byId(pair[0]); if(el) el.onchange=function(ev){ state.akreditasi[pair[1]]=ev.target.value; persist(); if(pair[1]==="bulan") render(); }; });
  document.querySelectorAll("[data-ladd]").forEach(function(btn){ btn.onclick=function(){ const key=btn.dataset.ladd; const inp=byId("ladd-"+key); const v=(inp.value||"").trim(); if(!v) return;
    const arr = key==="unit"?state.units:state.auditors; if(arr.indexOf(v)<0){ arr.push(v); persist(); render(); } }; });
  document.querySelectorAll("[data-ldel]").forEach(function(btn){ btn.onclick=function(){ const key=btn.dataset.ldel, v=btn.dataset.val;
    if(key==="unit") state.units=state.units.filter(function(x){return x!==v;}); else state.auditors=state.auditors.filter(function(x){return x!==v;}); persist(); render(); }; });
  document.querySelectorAll("[data-bopen]").forEach(function(btn){ btn.onclick=function(){ state.settingsOpen = state.settingsOpen===btn.dataset.bopen?null:btn.dataset.bopen; render(); }; });
  document.querySelectorAll("[data-bfield]").forEach(function(inp){ inp.onchange=function(){ const b=bundleById(inp.dataset.bid); if(b){ b[inp.dataset.bfield]=inp.value; persist(); } }; });
  document.querySelectorAll("[data-efield]").forEach(function(inp){ inp.onchange=function(){ const b=bundleById(inp.dataset.bid); if(!b) return; const el=b.elemen.filter(function(e){return e.id===inp.dataset.eid;})[0]; if(el){ el.teks=inp.value; persist(); } }; });
  document.querySelectorAll("[data-efase]").forEach(function(inp){ inp.onchange=function(){ const b=bundleById(inp.dataset.bid); if(!b) return; const el=b.elemen.filter(function(e){return e.id===inp.dataset.eid;})[0]; if(el){ el.fase=inp.value; persist(); } }; });
  document.querySelectorAll("[data-edel]").forEach(function(btn){ btn.onclick=function(){ const b=bundleById(btn.dataset.bid); if(b){ b.elemen=b.elemen.filter(function(e){return e.id!==btn.dataset.eid;}); persist(); render(); } }; });
  document.querySelectorAll("[data-eadd]").forEach(function(btn){ btn.onclick=function(){ const b=bundleById(btn.dataset.eadd); if(b){ b.elemen.push({id:uid(),teks:"Elemen baru",fase:(b.elemen.length?b.elemen[b.elemen.length-1].fase:"")}); persist(); render(); } }; });
  document.querySelectorAll("[data-bdel]").forEach(function(btn){ btn.onclick=function(){ if(confirm("Hapus bundle ini beserta elemennya?")){ state.bundles=state.bundles.filter(function(b){return b.id!==btn.dataset.bdel;}); persist(); render(); } }; });
  const ba=byId("b-add"); if(ba) ba.onclick=function(){ const id=uid(); state.bundles.push({id:id,kode:"BARU",nama:"Bundle Baru",deskripsi:"",elemen:[]}); state.settingsOpen=id; persist(); render(); };
  const br=byId("b-restore"); if(br) br.onclick=function(){ if(confirm("Pulihkan struktur bundle & elemen ke bawaan terbaru (dengan fase)? Semua observasi TETAP tersimpan, tetapi kustomisasi bundle akan hilang.")){ state.bundles=JSON.parse(JSON.stringify(DEFAULT_BUNDLES)); state.settingsOpen=null; state.paretoBundle=state.bundles[0].id; persist(); render(); } };
  const dr=byId("d-reset"); if(dr) dr.onclick=function(){ if(confirm("Hapus SEMUA "+state.observations.length+" observasi? Konfigurasi bundle tetap dipertahankan.")){ state.observations=[]; persist(); render(); } };
}

/* ═══════════════════ EKSPOR ═══════════════════ */
function unduh(content, filename, mime){ const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function detailRows(){
  return state.observations.map(function(o){ return {
    Tanggal:o.tanggal.replace("T"," "), Unit:o.unit, Bundle:o.bundleKode, Pasien:o.pasien, Kategori:o.kategori, Auditor:o.auditor,
    Hasil:o.patuh?"PATUH":"TIDAK PATUH",
    "Elemen Tidak": Object.keys(o.jawaban||{}).filter(function(id){return o.jawaban[id]==="Tidak";}).map(function(id){return namaEl(o.bundleId,id);}).join("; "),
    Foto:(o.foto?o.foto.length:0),
    Catatan:o.catatan||""
  }; });
}
function exportCSV(){
  const rows=detailRows(); if(!rows.length) return; const head=Object.keys(rows[0]);
  const q=function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; };
  const csv=[head.join(",")].concat(rows.map(function(r){ return head.map(function(h){return q(r[h]);}).join(","); })).join("\n");
  unduh("\ufeff"+csv,"audit-bundle-hais.csv","text/csv;charset=utf-8;");
}
function xmlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function sheetXML(name, headers, rows){
  const hr='<Row>'+headers.map(function(h){return '<Cell ss:StyleID="h"><Data ss:Type="String">'+xmlEsc(h)+'</Data></Cell>';}).join("")+'</Row>';
  const body=rows.map(function(r){ return '<Row>'+r.map(function(c){ const num=typeof c==="number"; return '<Cell><Data ss:Type="'+(num?"Number":"String")+'">'+xmlEsc(c)+'</Data></Cell>'; }).join("")+'</Row>'; }).join("");
  return '<Worksheet ss:Name="'+xmlEsc(name)+'"><Table>'+hr+body+'</Table></Worksheet>';
}
function workbookXML(sheets){
  return '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
    + '<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#E2E8F0" ss:Pattern="Solid"/></Style></Styles>'+sheets+'</Workbook>';
}
function exportExcel(){
  const d=detailRows(); if(!d.length) return; const dHead=Object.keys(d[0]); const dRows=d.map(function(r){ return dHead.map(function(h){return r[h];}); });
  const rekap=[]; state.bundles.forEach(function(b){ state.units.forEach(function(u){ const l=state.observations.filter(function(o){return o.bundleId===b.id&&o.unit===u;}); if(l.length){ const p=kepatuhan(l); rekap.push([b.kode,u,l.length,l.filter(function(o){return o.patuh;}).length, +p.toFixed(1)]); }}); });
  const xml=workbookXML(sheetXML("Detail",dHead,dRows)+sheetXML("Rekap",["Bundle","Unit","Observasi","Patuh","Kepatuhan (%)"],rekap));
  unduh(xml,"audit-bundle-hais.xls","application/vnd.ms-excel");
}
function exportStarkes(){
  const rows=state.bundles.map(function(b){ const l=state.observations.filter(function(o){return o.bundleId===b.id;}); const num=l.filter(function(o){return o.patuh;}).length, den=l.length, pct=den?num/den*100:null;
    return ["Kepatuhan "+b.nama, num, den, pct==null?"":+pct.toFixed(1), state.target, pct==null?"-":(pct>=state.target?"Tercapai":"Belum Tercapai")]; });
  const xml=workbookXML(sheetXML("Rekap STARKES",["Indikator Mutu","Numerator","Denominator","Capaian (%)","Target (%)","Status"],rows));
  unduh(xml,"rekap-starkes-hais.xls","application/vnd.ms-excel");
}

/* ═══════════════════ UI HELPER ═══════════════════ */
function byId(id){ return document.getElementById(id); }
function field(label, inner){ return '<div class="field"><label>'+label+'</label>'+inner+'</div>'; }
function selectEl(id, opts, current){
  const options = opts.map(function(o){ let val,txt; if(Array.isArray(o)){ val=o[0]; txt=o[1]; } else { val=o; txt=o; }
    const sel = (String(val)===String(current))?" selected":""; return '<option value="'+esc(val)+'"'+sel+'>'+esc(txt)+'</option>'; }).join("");
  return '<select id="'+id+'" class="inp">'+options+'</select>';
}
function emptyState(msg){ return '<div class="empty" style="margin-top:16px">'+svg("warn")+'<p>'+esc(msg)+'</p></div>'; }

/* ═══════════════════ RENDER ═══════════════════ */
function render(){
  document.getElementById("root").innerHTML=shell();
  document.querySelectorAll(".tabbar button").forEach(function(b){ b.onclick=function(){ state.tab=b.dataset.tab; render(); }; });
  const m=byId("main");
  if(state.tab==="dashboard"){ m.innerHTML=viewDashboard(); bindDashboard(); }
  else if(state.tab==="input"){ m.innerHTML=viewInput(); bindInput(); }
  else if(state.tab==="riwayat"){ m.innerHTML=viewRiwayat(); bindRiwayat(); applyRiwayat(); }
  else if(state.tab==="laporan"){ m.innerHTML=viewLaporan(); bindLaporan(); }
  else if(state.tab==="pengaturan"){ m.innerHTML=viewPengaturan(); bindPengaturan(); }
  window.scrollTo(0,0);
}
(function(){var l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l);})();
render();
