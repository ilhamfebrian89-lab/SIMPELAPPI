version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: simpelappi-api
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_URL: postgresql://simpelappi:simpelappi_dev@postgres:5432/simpelappi
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
      JWT_ISSUER: simpelappi-auth
      JWT_AUDIENCE: simpelappi-api
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: simpelappi-postgres
    environment:
      POSTGRES_DB: simpelappi
      POSTGRES_USER: simpelappi
      POSTGRES_PASSWORD: simpelappi_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpelappi -d simpelappi"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: simpelappi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@simpelappi.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: simpelappi-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
